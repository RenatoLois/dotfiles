font_family JetBrainsMono Nerd Font
font_size 11

cursor_trail 2
cursor_shape beam
mouse_hide_wait 3
cursor_beam_thickness 1.5
cursor_blink_interval 0.7
cursor_trail_decay 0.1 0.5
cursor_shape_unfocused hollow
scrollback_indicator_opacity 0.1
cursor_trail_start_threshold 2
scrollback_lines 100000000000000000000
# url_color #0087bd
url_style curly
detect_urls yes
click_interval -1
open_url_with default
focus_follows_mouse yes
pointer_shape_when_grabbed arrow
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

allow_remote_control yes

set-spacing margin=0

background_opacity 0.90
copy_on_select no
select_by_word_characters @-./_~?&=%+#
enable_audio_bell no
# visual_bell_color none
bell_on_tab "ðŸ”” "
remember_window_size  no
window_border_width 1pt
# draw_minimal_borders yes
window_padding_width 10
inactive_text_alpha 0.6
# hide_window_decorations yes
confirm_os_window_close 0
paste_actions no-op

tab_bar_style custom
tab_bar_margin_height 0.0 0.0
tab_bar_margin_width 0.0
tab_fade 0.25 0.5 0.75 1
tab_separator "â”‚"
tab_activity_symbol  none
# active_tab_foreground   #000
# active_tab_background   #eee
active_tab_font_style   bold-italic
# inactive_tab_foreground #444
# inactive_tab_background #999
inactive_tab_font_style normal
# foreground #dddddd
# background #000000
tab_bar_edge bottom
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous

#map alt+shift+1 goto_tab 1
#map alt+shift+2 goto_tab 2
#map alt+shift+3 goto_tab 3
#map alt+shift+4 goto_tab 4
#map alt+shift+5 goto_tab 5 
#map alt+shift+6 goto_tab 6
#map alt+shift+7 goto_tab 7
#map alt+shift+8 goto_tab 8
#map alt+shift+9 goto_tab 9
#map alt+shift+0 goto_tab 10

#map alt+t new_tab
#map alt+w close_tab

#map alt+h launch --location=hsplit
#map alt+v launch --location=vsplit

#map ctrl+shift+down scroll_line_down
#map ctrl+shift+j scroll_line_down
#map opt+cmd+page_down scroll_line_down
#map cmd+down scroll_line_down
#map ctrl+shift+home scroll_home
#map cmd+home scroll_home
#map ctrl+shift+end scroll_end
#map cmd+end scroll_end

#map ctrl+shift+] next_window
#map ctrl+shift+[ previous_window
#map alt+] next_window
#map alt+[ previous_window
#map ctrl+shift+f move_window_forward
#map ctrl+shift+b move_window_backward
#map ctrl+shift+` move_window_to_top

map ctrl+shift+h noop
map ctrl+shift+l noop

# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
